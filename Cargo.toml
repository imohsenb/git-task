[package]
name = "git-task"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "git-task"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
anyhow = "1"
thiserror = "1"
comfy-table = "7"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
