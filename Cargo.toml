[package]
name = "git-task"
version = "1.0.4"
edition = "2021"

[lib]
name = "git_task"
path = "src/lib.rs"

[[bin]]
name = "git-task"
path = "src/bin/git-task.rs"

[[bin]]
name = "gtask"
path = "src/bin/gtask.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
git2 = { version = "0.19", features = ["vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
anyhow = "1"
thiserror = "1"
evalexpr = "11"
clap_complete = "4"
clap_mangen = "0.2"
crossterm = { version = "0.29", default-features = false }
inquire = { version = "0.9", features = ["date"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
