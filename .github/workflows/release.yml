name: Release

# Runs after every merge to master. Bumps the patch version (first release is
# v1.0.0), tags it, and publishes a GitHub Release. The version-bump commit
# this workflow pushes back to master carries "[skip ci]" and is the only
# thing that guards against re-triggering itself in an infinite loop.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-tag-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        run: |
          set -euo pipefail
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            new_version="1.0.0"
          else
            ver="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            new_version="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Bump Cargo.toml version
        run: |
          set -euo pipefail
          awk -v new="${{ steps.bump.outputs.version }}" '
            /^\[package\]/ { inpkg=1 }
            /^\[/ && !/^\[package\]/ { inpkg=0 }
            inpkg && /^version = / && !done { sub(/version = ".*"/, "version = \"" new "\""); done=1 }
            { print }
          ' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Refresh Cargo.lock
        run: cargo check --workspace

      - name: Commit bump, tag, and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:master
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
