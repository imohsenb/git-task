name: Release

# Runs after every merge to main. Reads the version already committed in
# Cargo.toml, tags it, and publishes a GitHub Release. The "version bump" job
# in verify.yml enforces on every PR that Cargo.toml's version is bumped past
# the latest tag before merge, so this workflow never mutates the repo -- it
# only tags and releases whatever version main already has.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from Cargo.toml
        id: version
        run: |
          set -euo pipefail
          version=$(awk '/^\[package\]/{f=1} f && /^version[[:space:]]*=/{print; exit}' Cargo.toml \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        run: |
          set -euo pipefail
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: git tag "${{ steps.version.outputs.tag }}" && git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

  build-binaries:
    needs: tag-release
    if: needs.tag-release.outputs.is_new == 'true'
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="git-task-${{ needs.tag-release.outputs.version }}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          tar -czf "${name}.tar.gz" -C "${dir}" git-task gtask
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-release.outputs.tag }}
          files: ${{ steps.package.outputs.asset }}
