name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace --locked --verbose

      - name: cargo test
        run: cargo test --workspace --locked --verbose

  version-bump:
    name: version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure Cargo.toml version is bumped past the latest release tag
        run: |
          set -euo pipefail
          current=$(awk '/^\[package\]/{f=1} f && /^version[[:space:]]*=/{print; exit}' Cargo.toml \
            | sed -E 's/.*"([^"]+)".*/\1/')
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest="${latest_tag#v}"
          latest="${latest:-0.0.0}"
          echo "Cargo.toml version: ${current}"
          echo "Latest release tag: ${latest_tag:-<none>}"
          highest=$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -n1)
          if [ "$highest" != "$current" ] || [ "$current" = "$latest" ]; then
            echo "::error file=Cargo.toml::version (${current}) must be bumped above the latest release tag (${latest})"
            exit 1
          fi
